<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620">
  <title>Compare two flights</title>
  <desc>Two colored curves show possible flight paths for a paper glider.</desc>
  <rect width="900" height="620" rx="28" fill="#fdf5e7"/>
  <text x="66" y="108" fill="#362b20" font-family="sans-serif" font-size="50" font-weight="bold">Compare Two Flights</text>
  <circle cx="150" cy="325" r="10" fill="#362b20"/>
  <path d="M150 325 Q405 154 704 248" fill="none" stroke="#b45124" stroke-width="8" stroke-linecap="round"/>
  <path d="M150 325 Q428 232 665 371" fill="none" stroke="#136d64" stroke-width="8" stroke-dasharray="14 16" stroke-linecap="round"/>
  <text x="66" y="490" fill="#362b20" font-family="sans-serif" font-size="34">Try two flights.</text>
  <text x="66" y="540" fill="#362b20" font-family="sans-serif" font-size="34">Change one fold and see what happens.</text>
</svg>
