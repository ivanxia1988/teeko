<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620">
  <title>Whale snot science</title>
  <desc>A short news passage about drones collecting whale snot, a key word card for "sample", and a big question: are whales that look for food together family or friends?</desc>
  <rect width="900" height="620" rx="28" fill="#fdf5e7"/>
  <text x="56" y="80" fill="#362b20" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="bold">Whale Snot Science</text>
  <rect x="56" y="100" width="76" height="28" rx="14" fill="#3d556b"/>
  <text x="94" y="120" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">FACT</text>
  <text x="144" y="120" fill="#7a6a58" font-family="Helvetica, Arial, sans-serif" font-size="17">from the news</text>
  <text x="56" y="178" fill="#362b20" font-family="Helvetica, Arial, sans-serif" font-size="27">Near the coast of Canada,</text>
  <text x="56" y="215" fill="#362b20" font-family="Helvetica, Arial, sans-serif" font-size="27">scientists flew drones into</text>
  <text x="56" y="252" fill="#362b20" font-family="Helvetica, Arial, sans-serif" font-size="27">the spray of 56 humpback</text>
  <text x="56" y="289" fill="#362b20" font-family="Helvetica, Arial, sans-serif" font-size="27">whales. The drones caught</text>
  <text x="56" y="326" fill="#362b20" font-family="Helvetica, Arial, sans-serif" font-size="27">a little whale snot. This</text>
  <text x="56" y="363" fill="#362b20" font-family="Helvetica, Arial, sans-serif" font-size="27"><tspan fill="#c4561c" font-weight="bold">sample</tspan> has whale DNA. DNA</text>
  <text x="56" y="400" fill="#362b20" font-family="Helvetica, Arial, sans-serif" font-size="27">can help show which whales</text>
  <text x="56" y="437" fill="#362b20" font-family="Helvetica, Arial, sans-serif" font-size="27">are family.</text>
  <circle cx="690" cy="200" r="26" fill="#eaf6fc" stroke="#9cc7de" stroke-width="3"/>
  <circle cx="735" cy="182" r="32" fill="#eaf6fc" stroke="#9cc7de" stroke-width="3"/>
  <circle cx="782" cy="200" r="26" fill="#eaf6fc" stroke="#9cc7de" stroke-width="3"/>
  <circle cx="712" cy="224" r="24" fill="#eaf6fc" stroke="#9cc7de" stroke-width="3"/>
  <circle cx="760" cy="226" r="24" fill="#eaf6fc" stroke="#9cc7de" stroke-width="3"/>
  <circle cx="735" cy="150" r="22" fill="#eaf6fc" stroke="#9cc7de" stroke-width="3"/>
  <circle cx="690" cy="200" r="23" fill="#eaf6fc"/>
  <circle cx="735" cy="182" r="29" fill="#eaf6fc"/>
  <circle cx="782" cy="200" r="23" fill="#eaf6fc"/>
  <circle cx="712" cy="224" r="21" fill="#eaf6fc"/>
  <circle cx="760" cy="226" r="21" fill="#eaf6fc"/>
  <circle cx="735" cy="150" r="19" fill="#eaf6fc"/>
  <g stroke="#2b3440" stroke-width="4" stroke-linecap="round">
    <line x1="687" y1="202" x2="717" y2="214"/><line x1="783" y1="202" x2="753" y2="214"/>
    <line x1="687" y1="202" x2="687" y2="194"/><line x1="783" y1="202" x2="783" y2="194"/></g>
  <ellipse cx="687" cy="192" rx="24" ry="5" fill="#9aa7b4" stroke="#2b3440" stroke-width="3"/>
  <ellipse cx="783" cy="192" rx="24" ry="5" fill="#9aa7b4" stroke="#2b3440" stroke-width="3"/>
  <rect x="709" y="204" width="52" height="22" rx="8" fill="#ed8745" stroke="#2b3440" stroke-width="3"/>
  <circle cx="735" cy="215" r="4" fill="#2b3440"/>
  <line x1="735" y1="226" x2="735" y2="240" stroke="#2b3440" stroke-width="3"/>
  <path d="M717 240 h36 l-5 16 h-26 Z" fill="#ffffff" stroke="#2b3440" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="735" cy="245" rx="12" ry="3" fill="#b8dcef"/>
  <rect x="600" y="294" width="260" height="146" rx="18" fill="#ffffff" stroke="#ed8745" stroke-width="3"/>
  <text x="730" y="326" fill="#7a6a58" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">KEY WORD</text>
  <text x="730" y="378" fill="#c4561c" font-family="Helvetica, Arial, sans-serif" font-size="44" font-weight="bold" text-anchor="middle">sample</text>
  <text x="730" y="418" fill="#362b20" font-family="Helvetica, Arial, sans-serif" font-size="21" text-anchor="middle">a small bit to study</text>
  <rect x="40" y="466" width="820" height="130" rx="20" fill="#fff1df" stroke="#ed8745" stroke-width="3" stroke-dasharray="10 7"/>
  <text x="68" y="498" fill="#a54a21" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold">BIG QUESTION · Scientists don't know yet.</text>
  <text x="68" y="538" fill="#362b20" font-family="Helvetica, Arial, sans-serif" font-size="28">Are whales that look for food together</text>
  <text x="68" y="576" fill="#362b20" font-family="Helvetica, Arial, sans-serif" font-size="28">family or friends?</text>
</svg>
